<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <title>Spirit Crystal</title>
  
  <!-- Outer glow effect -->
  <defs>
    <radialGradient id="crystalGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#a78bfa;stop-opacity:0.4" />
      <stop offset="100%" style="stop-color:#7c3aed;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="crystalFill" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#c4b5fd" />
      <stop offset="50%" style="stop-color:#a78bfa" />
      <stop offset="100%" style="stop-color:#7c3aed" />
    </linearGradient>
    <linearGradient id="crystalHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#ffffff;stop-opacity:0" />
    </linearGradient>
  </defs>
  
  <!-- Glow background -->
  <circle cx="16" cy="16" r="14" fill="url(#crystalGlow)" />
  
  <!-- Main crystal body - geometric faceted design -->
  <path 
    d="M16 4 L22 10 L22 18 L16 28 L10 18 L10 10 Z" 
    fill="url(#crystalFill)" 
    stroke="#6d28d9" 
    stroke-width="1.5" 
    stroke-linejoin="miter"
  />
  
  <!-- Left facet -->
  <path 
    d="M10 10 L16 4 L16 14 Z" 
    fill="#8b5cf6" 
    opacity="0.6"
  />
  
  <!-- Right facet -->
  <path 
    d="M22 10 L16 4 L16 14 Z" 
    fill="#a78bfa" 
    opacity="0.4"
  />
  
  <!-- Center facet -->
  <path 
    d="M10 10 L16 14 L22 10 L16 8 Z" 
    fill="#c4b5fd" 
    opacity="0.5"
  />
  
  <!-- Bottom left facet -->
  <path 
    d="M10 18 L16 28 L16 14 L10 10 Z" 
    fill="#6d28d9" 
    opacity="0.7"
  />
  
  <!-- Bottom right facet -->
  <path 
    d="M22 18 L16 28 L16 14 L22 10 Z" 
    fill="#7c3aed" 
    opacity="0.6"
  />
  
  <!-- Top highlight shine -->
  <path 
    d="M16 4 L19 8 L16 10 L13 8 Z" 
    fill="url(#crystalHighlight)" 
    opacity="0.9"
  />
  
  <!-- Inner glow accent -->
  <ellipse 
    cx="16" 
    cy="14" 
    rx="3" 
    ry="4" 
    fill="#ffffff" 
    opacity="0.3"
  />
  
  <!-- Edge highlights for depth -->
  <line x1="16" y1="4" x2="16" y2="28" stroke="#e9d5ff" stroke-width="0.5" opacity="0.6" />
  <line x1="10" y1="10" x2="16" y2="14" stroke="#ddd6fe" stroke-width="0.5" opacity="0.4" />
  <line x1="22" y1="10" x2="16" y2="14" stroke="#ddd6fe" stroke-width="0.5" opacity="0.4" />
</svg>
