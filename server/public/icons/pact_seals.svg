<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="sealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFD54F;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="sealGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#FFE082;stop-opacity:0.6" />
      <stop offset="100%" style="stop-color:#F57C00;stop-opacity:0" />
    </radialGradient>
  </defs>
  <g>
    <!-- Glow effect -->
    <circle cx="32" cy="32" r="26" fill="url(#sealGlow)"/>
    <!-- Seal circle -->
    <circle cx="32" cy="32" r="22" fill="url(#sealGrad)" stroke="#E65100" stroke-width="2"/>
    <!-- Inner circle -->
    <circle cx="32" cy="32" r="18" fill="none" stroke="#FFE082" stroke-width="1.5" opacity="0.8"/>
    <!-- Pentagram -->
    <path d="M32 16 L36 26 L46 26 L38 32 L42 42 L32 36 L22 42 L26 32 L18 26 L28 26 Z" 
          fill="none" stroke="#E65100" stroke-width="2" stroke-linejoin="miter"/>
    <!-- Center dot -->
    <circle cx="32" cy="32" r="3" fill="#E65100"/>
    <!-- Decorative runes -->
    <text x="32" y="12" font-family="serif" font-size="8" fill="#E65100" text-anchor="middle" opacity="0.7">✦</text>
    <text x="32" y="56" font-family="serif" font-size="8" fill="#E65100" text-anchor="middle" opacity="0.7">✦</text>
  </g>
</svg>
